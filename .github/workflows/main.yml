name: Gideon Global Marketing APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android project structure
        shell: bash
        run: |
          set -euo pipefail

          # The repository currently stores Android source files at its root.
          # Assemble them into the standard :app module expected by settings.gradle.kts.
          mkdir -p app/src/main app/src/test gradle
          cp build.gradle.kts app/build.gradle.kts
          cp libs.versions.toml gradle/libs.versions.toml

          cat > build.gradle.kts <<'ROOT'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          ROOT

          # Place Kotlin files under folders matching their declared package.
          for f in ./*.kt; do
            [ -f "$f" ] || continue
            pkg="$(sed -n 's/^package[[:space:]]\+//p' "$f" | head -n 1 | tr -d '\r')"
            [ -n "$pkg" ] || { echo "Missing package declaration in $f"; exit 1; }
            dest="app/src/main/java/${pkg//./\/}"
            case "$(basename "$f")" in
              *Test.kt|*TestBase.kt) dest="app/src/test/java/${pkg//./\/}" ;;
            esac
            mkdir -p "$dest"
            cp "$f" "$dest/"
          done

          mkdir -p app/src/main/res/values app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml colors.xml themes.xml app/src/main/res/values/
          cp backup_rules.xml data_extraction_rules.xml app/src/main/res/xml/
          cp ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi/
          cp ic_launcher_background.xml ic_launcher_foreground.xml app/src/main/res/drawable/
          cp ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher_round.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp img_*.jpg app/src/main/res/drawable-nodpi/
          cp google-services.json app/google-services.json
          cp proguard-rules.pro app/proguard-rules.pro

          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          echo "Android module structure prepared."

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
