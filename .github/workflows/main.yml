name: Gideon Global Marketing APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Print Android signing fingerprints
        run: |
          gradle :app:signingReport | tee signing-report.txt
          cat signing-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signing fingerprint report
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-Signing-Report
          path: signing-report.txt
