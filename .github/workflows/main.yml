name: Gideon Global Marketing APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/assets

          cp build.gradle.kts app/build.gradle.kts
          echo "plugins {}" > build.gradle.kts

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          for file in *.kt; do
            [ -f "$file" ] && cp "$file" app/src/main/java/
          done

          cp strings.xml app/src/main/res/values/
          cp colors.xml app/src/main/res/values/
          cp themes.xml app/src/main/res/values/

          cp backup_rules.xml app/src/main/res/xml/
          cp data_extraction_rules.xml app/src/main/res/xml/

          cp ic_launcher_background.xml app/src/main/res/drawable/
          cp ic_launcher_foreground.xml app/src/main/res/drawable/

          cp ic_launcher.xml app/src/main/res/mipmap-hdpi/
          cp ic_launcher_round.xml app/src/main/res/mipmap-hdpi/

          cp ic_launcher.png app/src/main/res/mipmap-hdpi/
          cp ic_launcher_round.png app/src/main/res/mipmap-hdpi/

          cp google-services.json app/

          mkdir -p gradle
          cp libs.versions.toml gradle/

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Gideon Global Marketing APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
