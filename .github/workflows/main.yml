name: Gideon Global Marketing APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app gradle

          cp build.gradle.kts app/build.gradle.kts
          cp libs.versions.toml gradle/libs.versions.toml

          cat > build.gradle.kts <<'EOF'
          plugins {
          }
          EOF

          mkdir -p app/src/main/java
          mkdir -p app/src/main/res

          if [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          fi

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          for file in *.kt; do
            [ -f "$file" ] || continue
            package_name=$(sed -n 's/^[[:space:]]*package[[:space:]]\+\([^[:space:]]*\).*/\1/p' "$file" | head -n 1)

            if [ -n "$package_name" ]; then
              package_path=$(echo "$package_name" | tr '.' '/')
              mkdir -p "app/src/main/java/$package_path"
              cp "$file" "app/src/main/java/$package_path/"
            else
              cp "$file" app/src/main/java/
            fi
          done

          for folder in drawable drawable-v24 mipmap mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi values xml font raw; do
            if [ -d "$folder" ]; then
              mkdir -p "app/src/main/res/$folder"
              cp -r "$folder/." "app/src/main/res/$folder/"
            fi
          done

          if [ -f proguard-rules.pro ]; then
            cp proguard-rules.pro app/
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
