name: Gideon Global Marketing APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ -f build.gradle.kts ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

          echo "plugins {}" > build.gradle.kts

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          for file in *.kt; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/java/
            fi
          done

          if [ -d res ]; then
            cp -R res/. app/src/main/res/
          fi

          for file in strings.xml colors.xml themes.xml; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/res/values/
            fi
          done

          if [ -f google-services.json ]; then
            cp google-services.json app/
          fi

          if [ -f libs.versions.toml ]; then
            mkdir -p gradle
            cp libs.versions.toml gradle/
          fi

          if [ -d assets ]; then
            cp -R assets/. app/src/main/assets/
          fi

          if [ -d fonts ]; then
            cp -R fonts/. app/src/main/assets/
          fi

      - name: Build Gideon Global Marketing APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
