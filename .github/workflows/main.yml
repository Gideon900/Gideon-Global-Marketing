name: Gideon Global Marketing APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android project structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java app/src/main/res/values app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/assets gradle

          cp build.gradle.kts app/build.gradle.kts
          cp libs.versions.toml gradle/libs.versions.toml
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp google-services.json app/google-services.json

          cat > build.gradle.kts <<'EOF'
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF

          for source in ./*.kt; do
            [ -f "$source" ] || continue
            name="$(basename "$source")"
            case "$name" in
              *Test.kt|FirestoreEmulatorTestBase.kt) continue ;;
            esac
            cp "$source" app/src/main/java/
          done

          cp strings.xml colors.xml themes.xml app/src/main/res/values/
          cp backup_rules.xml data_extraction_rules.xml app/src/main/res/xml/
          cp ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher_round.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          for asset in img_*.jpg; do
            [ -f "$asset" ] && cp "$asset" app/src/main/res/drawable-nodpi/
          done

          cp playfair_display.ttf plus_jakarta_sans.ttf app/src/main/assets/

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gideon Global Marketing APK
        uses: actions/upload-artifact@v4
        with:
          name: Gideon-Global-Marketing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
